<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>PONG GAME</h1>
        <div class="scoreboard">
            <div class="player-score">
                <h2>PLAYER</h2>
                <p id="playerScore">0</p>
            </div>
            <div class="divider"></div>
            <div class="computer-score">
                <h2>COMPUTER</h2>
                <p id="computerScore">0</p>
            </div>
        </div>
        
        <canvas id="pongCanvas" width="1000" height="600"></canvas>
        
        <div class="controls">
            <p>Use <strong>Mouse</strong> or <strong>Arrow Keys (↑↓)</strong> to move the left paddle</p>
            <p>Computer controls the right paddle</p>
            <button id="startBtn" class="start-btn">Start Game</button>
            <button id="resetBtn" class="reset-btn">Reset Score</button>
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
